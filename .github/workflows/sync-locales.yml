name: Sync locales

on:
    push:
        branches: ["**"]
        paths:
            - "messages/*.json"
            - "scripts/sync-locales.mjs"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    sync:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref }}

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Update the locale list
              run: bun run locales:sync

            - name: Commit the updated locale list
              run: |
                  if git diff --quiet -- project.inlang/settings.json; then
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add project.inlang/settings.json
                  git commit -m "chore(i18n): sync locale list" -m "LLM [Minor]: DeepSeek v4.1 Flash 1017 (Free), High, T3 Code + OpenCode, OpenCode"
                  git push origin "HEAD:${{ github.ref_name }}"
